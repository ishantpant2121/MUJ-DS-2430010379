name: Update presentation author credit

on:
  push:
    branches:
      - fix/presentation-author-credit

permissions:
  contents: write

jobs:
  update-presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update cover credits and workflow label
        run: |
          python -m pip install python-pptx
          python - <<'PY'
          from pathlib import Path
          from pptx import Presentation
          from pptx.util import Pt

          path = Path("presentations/OWERF_Project_Presentation.pptx")
          prs = Presentation(path)

          cover = prs.slides[0]
          footer = next((s for s in cover.shapes if s.name == "Footer line"), None)
          if footer is None or not footer.has_text_frame:
              raise RuntimeError("Could not locate the original cover footer.")
          p = footer.text_frame.paragraphs[0]
          text = "Ishant Pant | Research Supervisor: Dr. Sandeep Gupta"
          if p.runs:
              p.runs[0].text = text
              for run in list(p.runs[1:]):
                  run._r.getparent().remove(run._r)
              p.runs[0].font.size = Pt(11)
          else:
              run = p.add_run()
              run.text = text
              run.font.size = Pt(11)

          operational = prs.slides[11]
          title = next((s for s in operational.shapes
                        if s.has_text_frame and "How it works in real life" in s.text), None)
          if title is None:
              raise RuntimeError("Could not find the operational-workflow slide title.")
          for paragraph in title.text_frame.paragraphs:
              if paragraph.runs:
                  paragraph.runs[0].text = paragraph.runs[0].text.replace(
                      "How it works in real life", "Illustrative operational workflow"
                  )
                  for run in list(paragraph.runs[1:]):
                      run._r.getparent().remove(run._r)
              else:
                  paragraph.text = paragraph.text.replace(
                      "How it works in real life", "Illustrative operational workflow"
                  )

          prs.save(path)

          verify = Presentation(path)
          assert "Ishant Pant | Research Supervisor: Dr. Sandeep Gupta" in verify.slides[0].shapes[4].text
          assert any(s.has_text_frame and "Illustrative operational workflow" in s.text for s in verify.slides[11].shapes)
          full_text = []
          for slide in verify.slides:
              for shape in slide.shapes:
                  if shape.has_text_frame:
                      full_text.append(shape.text)
          joined = "\n".join(full_text).lower()
          assert "siddhika" not in joined and "agrawal" not in joined and "agarwal" not in joined
          print("PASS: cover credits Ishant Pant and Dr. Sandeep Gupta; operational slide is labelled illustrative; no matching student name remains.")
          print(f"Updated presentation size: {path.stat().st_size} bytes")
          PY
      - name: Commit updated presentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentations/OWERF_Project_Presentation.pptx
          git commit -m "docs: align presentation credit and workflow wording"
          git push origin HEAD:fix/presentation-author-credit
