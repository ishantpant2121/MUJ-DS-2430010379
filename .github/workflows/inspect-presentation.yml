name: Temporary presentation text audit

on:
  push:
    branches:
      - audit/inspect-presentation

permissions:
  contents: read

jobs:
  inspect-pptx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print visible presentation text
        shell: bash
        run: |
          python - <<'PY'
          import re, zipfile, xml.etree.ElementTree as ET
          from pathlib import Path
          files = list(Path("presentations").glob("*.pptx"))
          for path in files:
              print(f"FILE: {path}")
              with zipfile.ZipFile(path) as z:
                  names = sorted(
                      [n for n in z.namelist() if re.fullmatch(r"ppt/slides/slide\d+\.xml", n)],
                      key=lambda n: int(re.search(r"slide(\d+)", n).group(1))
                  )
                  for name in names:
                      root = ET.fromstring(z.read(name))
                      parts = [x.text.strip() for x in root.iter() if x.tag.endswith("}t") and x.text and x.text.strip()]
                      print(f"--- {name} ---")
                      print(" | ".join(parts))
                  for name in sorted(n for n in z.namelist() if re.fullmatch(r"ppt/notesSlides/notesSlide\d+\.xml", n)):
                      root = ET.fromstring(z.read(name))
                      parts = [x.text.strip() for x in root.iter() if x.tag.endswith("}t") and x.text and x.text.strip()]
                      text = " | ".join(parts)
                      if text:
                          print(f"--- {name} ---")
                          print(text)
          PY
