name: Build research paper PDF

on:
  push:
    branches:
      - main
    paths:
      - "paper/main.tex"
      - "paper/references.bib"
      - ".github/workflows/build-paper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Compile paper with LaTeX and BibTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Verify source author block and generated PDF
        run: |
          test -s paper/main.pdf
          grep -q "Ishant Pant" paper/main.tex
          grep -q "Dr. Sandeep Gupta" paper/main.tex
          if grep -Eiq "Siddhika|Siddhik|Agarwal|Agrawal" paper/main.tex; then
            echo "Unexpected person-name match in manuscript source."
            exit 1
          fi
          cp paper/main.pdf paper/OWERF_Research_Paper.pdf
          echo "Compiled PDF size: $(wc -c < paper/OWERF_Research_Paper.pdf) bytes"

      - name: Commit compiled PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/OWERF_Research_Paper.pdf
          if git diff --cached --quiet; then
            echo "Compiled PDF is unchanged; no commit needed."
          else
            git commit -m "build: publish compiled research paper PDF"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main update (attempt $attempt); retrying after rebase."
            sleep $((attempt * 2))
          done
          echo "Could not publish generated artifact after 5 attempts."
          exit 1
          fi
