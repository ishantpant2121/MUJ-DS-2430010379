name: Build research paper PDF

on:
  push:
    branches:
      - main
    paths:
      - "paper/main.tex"
      - "paper/references.bib"
      - ".github/workflows/build-paper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Compile paper with LaTeX and BibTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Verify generated PDF and author block
        run: |
          test -s paper/main.pdf
          pdftotext -layout paper/main.pdf /tmp/paper.txt
          grep -q "Ishant Pant" /tmp/paper.txt
          grep -q "Dr. Sandeep Gupta" /tmp/paper.txt
          if grep -Eiq "Siddhika|Siddhik|Agarwal|Agrawal" /tmp/paper.txt; then
            echo "Unexpected person-name match in generated paper."
            exit 1
          fi
          cp paper/main.pdf paper/OWERF_Research_Paper.pdf
          pdfinfo paper/OWERF_Research_Paper.pdf | grep -E "Pages:|File size:"

      - name: Commit compiled PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/OWERF_Research_Paper.pdf
          if git diff --cached --quiet; then
            echo "Compiled PDF is unchanged; no commit needed."
          else
            git commit -m "build: publish compiled research paper PDF"
            git push origin HEAD:main
          fi
