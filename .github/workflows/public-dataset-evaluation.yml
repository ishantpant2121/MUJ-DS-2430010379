name: Public provider dataset train-test

on:
  push:
    branches: [main]
    paths:
      - "scripts/train_public_provider_dataset.py"
      - "scripts/score_provider_features.py"
      - "requirements.txt"
      - "tests/test_public_provider_dataset.py"
      - ".github/workflows/public-dataset-evaluation.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/train_public_provider_dataset.py"
      - "scripts/score_provider_features.py"
      - "requirements.txt"
      - "tests/test_public_provider_dataset.py"
      - ".github/workflows/public-dataset-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-data-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit tests for dataset engineering and modeling
        run: python -m pytest tests/test_public_provider_dataset.py -v
      - name: Download public labeled train tables, train models and evaluate held-out providers
        run: |
          python scripts/train_public_provider_dataset.py --data-dir data/external/raw --output-dir results --seed 42
          python scripts/score_provider_features.py --model models/public_provider_fraud_model.joblib --features results/public_provider_features.csv --output results/public_provider_scored_features.csv
      - name: Validate the external-data report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          report = json.loads(Path("results/public_provider_fraud_report.json").read_text())
          assert report["provider_count"] >= 5000, report["provider_count"]
          assert report["label_counts"]["potential_fraud"] >= 400, report["label_counts"]
          assert report["split"]["train_providers"] + report["split"]["validation_providers"] + report["split"]["test_providers"] == report["provider_count"]
          assert 0 <= report["selected_model_test_metrics_at_validation_5pct_fpr_threshold"]["roc_auc"] <= 1
          predictions = pd.read_csv("results/public_provider_test_predictions.csv")
          scored = pd.read_csv("results/public_provider_scored_features.csv")
          assert len(predictions) == report["split"]["test_providers"]
          assert len(scored) == report["provider_count"]
          assert predictions["PotentialFraud_true"].nunique() == 2
          print("PASS: public-provider train/validation/test split, metrics, predictions and scorer validated.")
          print("Selected model:", report["selected_model"])
          print("Test metrics:", report["selected_model_test_metrics_at_validation_5pct_fpr_threshold"])
          PY
      - name: Commit reproducible report, predictions and model
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/public_provider_fraud_model.joblib \
            results/public_provider_fraud_report.json \
            results/public_provider_test_predictions.csv
          if git diff --cached --quiet; then
            echo "Public provider experiment artifacts are unchanged."
            exit 0
          fi
          git commit -m "results: record public provider fraud train-test experiment"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main update (attempt $attempt); retrying after rebase."
            sleep $((attempt * 2))
          done
          echo "Could not publish public-data experiment artifacts after 5 attempts."
          exit 1
      - name: Upload report and prediction artifacts
        uses: actions/upload-artifact@v4
        with:
          name: public-provider-fraud-train-test-report
          path: |
            results/public_provider_fraud_report.json
            results/public_provider_test_predictions.csv
            results/public_provider_features.csv
            results/public_provider_scored_features.csv
          if-no-files-found: error
