name: Temporary presentation credit audit

on:
  push:
    branches:
      - docs/author-credit-cleanup

permissions:
  contents: read

jobs:
  scan-presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan PowerPoint text
        shell: bash
        run: |
          python - <<'PY'
          import re
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          targets = [
              "Siddhi" + "ka" + " " + "Agarwal",
              "Siddhi" + "ka" + " " + "Agrawal",
              "Siddhi" + "k" + " " + "Agarwal",
              "Siddhi" + "k" + " " + "Agrawal",
          ]
          pptx_files = list(Path(".").rglob("*.pptx"))
          found = []
          for path in pptx_files:
              with zipfile.ZipFile(path) as z:
                  for member in z.namelist():
                      if not member.endswith(".xml"):
                          continue
                      try:
                          root = ET.fromstring(z.read(member))
                      except ET.ParseError:
                          continue
                      parts = [x.strip() for x in root.itertext() if x and x.strip()]
                      text_space = re.sub(r"\\s+", " ", " ".join(parts)).lower()
                      text_joined = "".join(parts).lower()
                      if any(t.lower() in text_space or t.lower().replace(" ", "") in text_joined for t in targets) or "siddhika" in text_space or "siddhika" in text_joined:
                          found.append(member)
          if found:
              print("TARGET_PERSON_NAME_MATCH: found in PowerPoint XML parts:")
              for item in sorted(set(found)):
                  print(item)
              raise SystemExit(1)
          print(f"PASS: no target-person name found in XML text across {len(pptx_files)} PowerPoint file(s).")
          PY
