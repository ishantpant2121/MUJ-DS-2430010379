name: Temporary presentation layout audit

on:
  push:
    branches:
      - fix/presentation-author-credit

permissions:
  contents: read

jobs:
  inspect-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install python-pptx
      - name: Inspect cover slide shapes
        run: |
          python - <<'PY'
          from pptx import Presentation
          from pptx.dml.color import RGBColor
          from pathlib import Path
          p = Path("presentations/OWERF_Project_Presentation.pptx")
          prs = Presentation(p)
          slide = prs.slides[0]
          print(f"slide size: {prs.slide_width / 914400:.2f} x {prs.slide_height / 914400:.2f} inches")
          for i, shape in enumerate(slide.shapes):
              text = shape.text.replace("\n", " / ") if shape.has_text_frame else ""
              x,y,w,h = [v / 914400 for v in (shape.left,shape.top,shape.width,shape.height)]
              info = []
              if shape.has_text_frame and shape.text_frame.paragraphs:
                  for p in shape.text_frame.paragraphs[:2]:
                      for run in p.runs[:2]:
                          font = run.font
                          rgb = None
                          try:
                              rgb = str(font.color.rgb) if font.color and font.color.type else None
                          except Exception:
                              pass
                          info.append({"font":font.name,"size":str(font.size),"bold":font.bold,"rgb":rgb})
              print(f"SHAPE {i}: name={shape.name!r}, box=({x:.2f},{y:.2f},{w:.2f},{h:.2f}), text={text!r}, fonts={info}")
          PY
